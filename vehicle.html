tion.search).get('id');if(!id){root.innerHTML='<div class="inventory-empty">Vehicle not found.</div>';return}try{const url='https://dpsgtliddmdvfwjahkkq.supabase.co/rest/v1/Vehicles?select=*&id=eq.'+encodeURIComponent(id);const key='sb_publishable_f-MRqpvq-FGsxQ7dBNIyKQ_r8MB1VM0';const r=await fetch(url,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw new Error('Vehicle request failed');const rows=await r.json(),v=rows[0];if(!v){root.innerHTML='<div class="inventory-empty">This vehicle is no longer available.</div>';return}const e=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const title=[v.Year,v.Make,v.Model].filter(Boolean).join(' ');const price=Number(v.Price||0).toLocaleString('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});const specs=[['Year',v.Year],['Make',v.Make],['Model',v.Model],['Trim',v.Trim],['Odometer',v.Mileage?Number(v.Mileage).toLocaleString('en-CA')+' km':''],['Body Style',v.BodyStyle],['Transmission',v.Transmission],['Engine Cylinders',v.EngineCylinders],['Engine Size',v.EngineSize],['Drivetrain',v.Drivetrain],['Exterior Colour',v.ExteriorColor],['Interior Colour',v.InteriorColor],['Doors',v.Doors],['Fuel Type',v.FuelType],['Passengers',v.Passengers],['VIN',v.VIN]].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='');root.innerHTML='<div class="vehicle-detail-grid"><section class="detail-gallery"><div class="detail-main-image placeholder"><span>PHOTO GALLERY LOADING…</span></div></section><section class="detail-info"><p class="detail-year">'+(String(v.Status||'').toLowerCase()==='sold'?'SOLD':'PRE-OWNED')+'</p><h1 class="detail-title">'+e(title)+'</h1><div class="detail-meta"><span>'+(v.Mileage?Number(v.Mileage).toLocaleString('en-CA'):'')+' km</span><span>'+e(v.Transmission||'Automatic')+'</span></div><div class="detail-price"><strong>'+price+'</strong></div><div class="vehicle-action-stack"><div class="primary-action-row"><a class="btn btn-primary" href="book-test-drive.html?vehicle='+encodeURIComponent(v.id)+'">Book a Test Drive</a><a class="btn detail-outline" href="pre-approval.html?vehicle='+encodeURIComponent(v.id)+'">Get Pre-Approved</a></div></div><div class="detail-description"><h2>Vehicle Details</h2><p>'+e(v.Description||'Contact M.O Motors for complete vehicle details, features and availability.').replace(/\n/g,'<br>')+'</p></div><div class="spec-grid">'+specs.map(s=>'<div><span>'+e(s[0])+'</span><b>'+e(s[1])+'</b></div>').join('')+'</div></section></div>'}catch(err){console.error(err);root.innerHTML='<div class="inventory-empty">We could not load this vehicle. Please refresh and try again.</div>'}},500);</script><script src="test-drive-modal.js?v=20260823-3"></script></body></html>
