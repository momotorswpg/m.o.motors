<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vehicle | M.O Motors</title>
<meta name="description" content="View vehicle details at M.O Motors.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="finance-dropdown.css">
<link rel="stylesheet" href="vehicle-detail.css?v=20260823-5">
</head>
<body>
<header class="site-header"><div class="main-nav"><a class="brand" href="index.html"><img src="logo.png" alt="M.O Motors"></a><nav class="page-nav"><a href="inventory.html">Inventory</a><div class="finance-dropdown"><button type="button" class="finance-dropdown-toggle">Financing</button><div class="finance-dropdown-menu"><a href="pre-approval.html">Get Pre-Approved</a><a href="payment-estimator.html">Payment Estimator</a></div></div><a href="trade-in.html">Trade-In</a><a class="nav-cta" href="book-test-drive.html">Book a Test Drive</a></nav></div></header>
<main class="vehicle-detail-page">
<a class="back-link" href="inventory.html">← Back to Inventory</a>
<div id="vehicleDetail"><div class="inventory-loading">Loading vehicle…</div></div>
</main>
<script>
(function(){
  var root=document.getElementById('vehicleDetail');
  var id=new URLSearchParams(window.location.search).get('id');
  var base='https://dpsgtliddmdvfwjahkkq.supabase.co/rest/v1/';
  var key='sb_publishable_f-MRqpvq-FGsxQ7dBNIyKQ_r8MB1VM0';
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function money(v){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(v)||0);}
  function specs(v){var a=[['Year',v.Year],['Make',v.Make],['Model',v.Model],['Trim',v.Trim],['Odometer',v.Mileage?Number(v.Mileage).toLocaleString('en-CA')+' km':''],['Body Style',v.BodyStyle],['Transmission',v.Transmission],['Engine Cylinders',v.EngineCylinders],['Engine Size',v.EngineSize],['Drivetrain',v.Drivetrain],['Exterior Colour',v.ExteriorColor],['Interior Colour',v.InteriorColor],['Doors',v.Doors],['Fuel Type',v.FuelType],['Passengers',v.Passengers],['VIN',v.VIN]];return a.filter(function(x){return x[1]!==null&&x[1]!==undefined&&x[1]!=='';}).map(function(x){return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';}).join('');}
  function render(v,photos){var title=[v.Year,v.Make,v.Model].filter(Boolean).join(' ');var sold=String(v.Status||'').toLowerCase()==='sold';var image='';var thumbs='';if(photos.length){image='<img id="mainVehiclePhoto" src="'+esc(photos[0].image_url)+'" alt="'+esc(title)+'">';if(photos.length>1){thumbs='<div class="detail-thumbs">'+photos.map(function(p,i){return '<button class="detail-thumb '+(i===0?'active':'')+'" data-src="'+esc(p.image_url)+'"><img src="'+esc(p.image_url)+'" alt="Vehicle photo"></button>';}).join('')+'</div>';}}else{image='<span>PHOTO COMING SOON</span>';}
    root.innerHTML='<div class="vehicle-detail-grid"><section class="detail-gallery"><div class="detail-main-image '+(photos.length?'':'placeholder')+'">'+image+'</div>'+thumbs+'</section><section class="detail-info"><p class="detail-year">'+(sold?'SOLD':'PRE-OWNED')+'</p><h1 class="detail-title">'+esc(title)+'</h1><div class="detail-meta"><span>'+esc(v.Mileage?Number(v.Mileage).toLocaleString('en-CA'):'—')+' km</span><span>'+esc(v.Transmission||'Automatic')+'</span></div><div class="detail-price"><strong>'+money(v.Price)+'</strong></div>'+(!sold?'<div class="vehicle-action-stack"><div class="primary-action-row"><a class="btn btn-primary" href="book-test-drive.html?vehicle='+encodeURIComponent(v.id)+'">Book a Test Drive</a><a class="btn detail-outline" href="pre-approval.html?vehicle='+encodeURIComponent(v.id)+'">Get Pre-Approved</a></div></div>':'<p class="sold-label">This vehicle has been sold.</p>')+(v.CarfaxURL?'<a class="btn carfax-btn" href="'+esc(v.CarfaxURL)+'" target="_blank" rel="noopener">View CARFAX Report ↗</a>':'')+'<div class="detail-description"><h2>Vehicle Details</h2><p>'+esc(v.Description||'Contact M.O Motors for complete vehicle details, features and availability.').replace(/\n/g,'<br>')+'</p></div><div class="spec-grid">'+specs(v)+'</div></section></div>';
    document.title=title+' | M.O Motors';
    Array.prototype.forEach.call(document.querySelectorAll('.detail-thumb'),function(b){b.addEventListener('click',function(){var img=document.getElementById('mainVehiclePhoto');if(img)img.src=b.getAttribute('data-src');Array.prototype.forEach.call(document.querySelectorAll('.detail-thumb'),function(x){x.classList.remove('active');});b.classList.add('active');});});
  }
  function fail(msg){root.innerHTML='<div class="inventory-empty">'+esc(msg)+'</div>';}
  if(!id){fail('Vehicle not found.');return;}
  var headers={apikey:key,Authorization:'Bearer '+key};
  fetch(base+'Vehicles?select=*&id=eq.'+encodeURIComponent(id),{headers:headers})
    .then(function(r){if(!r.ok)throw new Error('Vehicle request failed ('+r.status+')');return r.json();})
    .then(function(rows){if(!rows||!rows.length)throw new Error('This vehicle is no longer available.');var v=rows[0];return fetch(base+'vehicle_images?select=*&vehicle_id=eq.'+encodeURIComponent(id)+'&order=is_primary.desc,sort_order.asc',{headers:headers}).then(function(r){return r.ok?r.json():[];}).then(function(p){render(v,p||[]);});})
    .catch(function(err){console.error(err);fail(err.message||'We could not load this vehicle right now.');});
  document.querySelector('.finance-dropdown-toggle').addEventListener('click',function(){this.parentElement.classList.toggle('open');});
})();
</script>
<script src="test-drive-modal.js?v=20260823-5"></script>
</body>
</html>
