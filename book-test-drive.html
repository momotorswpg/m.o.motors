<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book a Test Drive | M.O Motors</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="finance-dropdown.css"></head><body><header class="site-header"><div class="main-nav"><a class="brand" href="index.html"><img src="logo.png" alt="M.O Motors"></a><nav class="page-nav"><a href="inventory.html">Inventory</a><div class="finance-dropdown"><button type="button" class="finance-dropdown-toggle" aria-expanded="false">Financing</button><div class="finance-dropdown-menu"><a href="pre-approval.html">Get Pre-Approved</a><a href="payment-estimator.html">Payment Estimator</a></div></div><a href="trade-in.html">Trade-In</a><a class="nav-cta" href="book-test-drive.html">Book a Test Drive</a></nav></div></header><main class="form-page"><section class="form-hero"><p class="eyebrow red">M.O MOTORS</p><h1 class="page-title">Book a test drive.</h1><p>Choose your vehicle, preferred date and time. Our team will confirm your appointment.</p></section><form class="lead-form" id="testDriveForm"><label>Vehicle<select id="vehicle" required><option value="">Select a vehicle</option></select></label><div class="form-grid"><label>Preferred date<input id="date" type="date" required></label><label>Preferred time<select id="time" required><option value="">Select a time</option><option>10:00 AM</option><option>11:00 AM</option><option>12:00 PM</option><option>1:00 PM</option><option>2:00 PM</option><option>3:00 PM</option><option>4:00 PM</option><option>5:00 PM</option></select></label><label>First name<input required></label><label>Last name<input required></label><label>Phone<input type="tel" required></label><label>Email<input type="email" required></label></div><button class="btn btn-primary" type="submit">Request Test Drive</button><p id="formMessage" class="muted-copy"></p></form></main><script src="book-test-drive.js"></script><script>document.querySelectorAll('.finance-dropdown-toggle').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('.finance-dropdown');const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open)}));</script></body></html>
