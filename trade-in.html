<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sell, Trade or Consign | M.O Motors</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="finance-dropdown.css"><link rel="stylesheet" href="customer-services.css"></head><body><header class="site-header"><div class="main-nav"><a class="brand brand-wordmark" href="index.html" aria-label="M.O Motors home"><span class="brand-name"><span class="brand-name-accent">M.O.</span><span class="brand-name-main">MOTORS</span></span><span class="brand-tagline">CERTIFIED PRE-OWNED VEHICLES</span></a><button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">☰</button><nav id="nav" class="page-nav"></nav></div></header><main class="form-page service-form-page"><section class="form-hero"><p class="eyebrow red">YOUR VEHICLE</p><h1 class="page-title">Sell, trade or consign.</h1><p>Choose the option that works for you and tell us about your vehicle. Our team will review the details and contact you.</p></section><form class="lead-form customer-request-form" id="vehicleDispositionForm" data-request-type="vehicle_disposition"><div class="form-section"><h2>How can we help?</h2><div class="choice-grid choice-grid-three"><label class="choice-card"><input type="radio" name="request_goal" value="Trade In" required><span><strong>Trade In</strong><small>Apply your vehicle's value toward another vehicle.</small></span></label><label class="choice-card"><input type="radio" name="request_goal" value="Sell"><span><strong>Sell to Us</strong><small>Request an offer without purchasing another vehicle.</small></span></label><label class="choice-card"><input type="radio" name="request_goal" value="Consignment"><span><strong>Consignment</strong><small>Ask us to market and help sell your vehicle.</small></span></label></div></div><div class="form-section"><h2>Vehicle information</h2><div class="form-grid"><label>Year<input name="year" type="number" min="1980" max="2100" required></label><label>Make<input name="make" required></label><label>Model<input name="model" required></label><label>Trim<input name="trim"></label><label>Mileage (km)<input name="mileage" type="number" min="0" required></label><label>VIN<input name="vin" maxlength="17"></label><label>Condition<select name="condition" required><option value="">Select</option><option>Excellent</option><option>Good</option><option>Fair</option><option>Needs repair</option></select></label><label>Loan or lien remaining?<select name="loan_remaining"><option>Unsure</option><option>No</option><option>Yes</option></select></label><label class="wide">Damage, accident history or recent repairs<textarea name="vehicle_notes" rows="4"></textarea></label></div></div><div class="form-section"><h2>Your information</h2><div class="form-grid"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Phone<input name="phone" type="tel" required></label><label>Email<input name="email" type="email" required></label><label>Preferred contact<select name="contact_method"><option>Phone</option><option>Text</option><option>Email</option></select></label></div></div><button class="btn btn-primary" type="submit">Send Vehicle Request</button><p class="form-status muted-copy" role="status"></p></form></main><script src="customer-services.js"></script><script src="test-drive-modal.js"></script><script src="site-nav.js"></script></body></html>
