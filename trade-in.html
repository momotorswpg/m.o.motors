<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trade-In | M.O Motors</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="finance-dropdown.css"></head><body><header class="site-header"><div class="main-nav"><a class="brand" href="index.html"><img src="logo.png" alt="M.O Motors"></a><nav class="page-nav"><a href="inventory.html">Inventory</a><div class="finance-dropdown"><button type="button" class="finance-dropdown-toggle" aria-expanded="false">Financing</button><div class="finance-dropdown-menu"><a href="pre-approval.html">Get Pre-Approved</a><a href="payment-estimator.html">Payment Estimator</a></div></div><a href="trade-in.html">Trade-In</a><a class="nav-cta" href="book-test-drive.html">Book a Test Drive</a></nav></div></header><main class="form-page"><section class="form-hero"><p class="eyebrow red">TRADE-IN</p><h1 class="page-title">Value your trade.</h1><p>Tell us about your current vehicle and we'll help you take the next step.</p></section><form class="lead-form" id="tradeForm"><div class="form-grid"><label>Year<input type="number" min="1980" max="2100" required></label><label>Make<input required></label><label>Model<input required></label><label>Trim<input></label><label>Mileage (km)<input type="number" min="0" required></label><label>VIN<input></label><label>Condition<select required><option value="">Select</option><option>Excellent</option><option>Good</option><option>Fair</option></select></label><label>Loan remaining?<select><option>No</option><option>Yes</option></select></label><label>First name<input required></label><label>Last name<input required></label><label>Phone<input type="tel" required></label><label>Email<input type="email" required></label></div><button class="btn btn-primary" type="submit">Request Trade-In Value</button><p id="formMessage" class="muted-copy"></p></form></main><script>document.getElementById('tradeForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('formMessage').textContent='Thank you. Your trade-in request has been received and M.O Motors will contact you shortly.'});document.querySelectorAll('.finance-dropdown-toggle').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('.finance-dropdown');const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open)}));</script><script src="test-drive-modal.js"></script></body></html>
