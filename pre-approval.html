<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Get Pre-Approved | M.O Motors</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="finance-dropdown.css"></head><body><header class="site-header"><div class="main-nav"><a class="brand" href="index.html"><img src="logo.png" alt="M.O Motors"></a><nav class="page-nav"><a href="inventory.html">Inventory</a><div class="finance-dropdown"><button type="button" class="finance-dropdown-toggle" aria-expanded="false">Financing</button><div class="finance-dropdown-menu"><a href="pre-approval.html">Get Pre-Approved</a><a href="payment-estimator.html">Payment Estimator</a></div></div><a href="trade-in.html">Trade-In</a><a class="nav-cta" href="book-test-drive.html">Book a Test Drive</a></nav></div></header><main class="form-page"><section class="form-hero"><p class="eyebrow red">FINANCING PRE-APPROVAL</p><h1 class="page-title">Get pre-approved.</h1><p>Complete the application below and the M.O Motors team will contact you about your financing options.</p></section><section id="vehicleSummary" class="lead-form" style="display:none;margin-bottom:24px"><p class="eyebrow red">VEHICLE OF INTEREST</p><h2 id="selectedVehicleTitle" style="margin:0 0 8px"></h2><p id="selectedVehicleDetails" class="muted-copy" style="margin:0"></p></section><form class="lead-form" id="financeForm"><input type="hidden" name="vehicle_id" id="vehicleId"><div class="form-grid"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Phone<input name="phone" type="tel" required></label><label>Email<input name="email" type="email" required></label><label>Date of birth<input name="date_of_birth" type="date" required></label><label>Marital status<select name="marital_status"><option value="">Select</option><option>Single</option><option>Married</option><option>Common-law</option><option>Separated</option><option>Divorced</option><option>Widowed</option></select></label><label class="wide">Current address<input name="address" required></label><label>City<input name="city" required></label><label>Province<input name="province" value="Manitoba"></label><label>Postal code<input name="postal_code" required></label><label>Time at current address<input name="address_duration" placeholder="e.g. 2 years"></label><label>Housing status<select name="housing_status"><option value="">Select</option><option>Own</option><option>Rent</option><option>Live with family</option><option>Other</option></select></label><label>Monthly housing payment<input name="housing_payment" type="number" min="0"></label><label>Employment status<select name="employment_status" required><option value="">Select</option><option>Employed</option><option>Self-employed</option><option>Retired</option><option>Student</option><option>Other</option></select></label><label>Employer<input name="employer"></label><label>Occupation<input name="occupation"></label><label>Employment duration<input name="employment_duration" placeholder="e.g. 3 years"></label><label>Gross monthly income<input name="monthly_income" type="number" min="0"></label><label>Previous employment, if applicable<input name="previous_employment"></label><label>Previous bankruptcy?<select name="bankruptcy"><option value="">Select</option><option>No</option><option>Yes</option></select></label><label>Previous repossession?<select name="repossession"><option value="">Select</option><option>No</option><option>Yes</option></select></label><label>Credit self-rating<select name="credit_rating"><option value="">Select</option><option>Excellent</option><option>Good</option><option>Fair</option><option>Building/Rebuilding</option><option>Not sure</option></select></label><label class="wide">Vehicle of interest<input id="vehicleInterest" name="vehicle_interest" placeholder="Make and model, if known"></label><label>Estimated vehicle price<input id="vehiclePrice" name="vehicle_price" type="number" min="0"></label><label>Estimated down payment<input name="down_payment" type="number" min="0"></label><label>Do you have a trade-in?<select name="trade_in"><option value="">Select</option><option>No</option><option>Yes</option></select></label><label>Estimated trade value<input name="trade_value" type="number" min="0"></label><label class="wide">Additional notes<textarea name="notes" rows="4"></textarea></label></div><button class="btn btn-primary" type="submit">Request Pre-Approval</button><p id="formMessage" class="muted-copy"></p></form></main><script>const SUPABASE_URL='https://dpsgtliddmdvfwjahkkq.supabase.co',SUPABASE_KEY='sb_publishable_f-MRqpvq-FGsxQ7dBNIyKQ_r8MB1VM0',vehicleId=new URLSearchParams(location.search).get('vehicle');async function loadVehicle(){if(!vehicleId)return;document.getElementById('vehicleId').value=vehicleId;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/Vehicles?select=*&id=eq.${encodeURIComponent(vehicleId)}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw new Error();const rows=await r.json(),v=rows[0];if(!v)return;const title=`${v.Year||''} ${v.Make||''} ${v.Model||''}`.trim(),trim=v.Trim?` ${v.Trim}`:'',price=Number(v.Price);document.getElementById('selectedVehicleTitle').textContent=title+trim;document.getElementById('selectedVehicleDetails').textContent=[price?new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(price):'',v.Mileage?`${Number(v.Mileage).toLocaleString('en-CA')} km`:'',v.Transmission||''].filter(Boolean).join(' · ');document.getElementById('vehicleInterest').value=title+trim;if(price)document.getElementById('vehiclePrice').value=price;document.getElementById('vehicleSummary').style.display='block'}catch(e){console.warn('Could not load selected vehicle',e)}}loadVehicle();document.getElementById('financeForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('formMessage').textContent='Thank you. Your pre-approval request has been received and M.O Motors will contact you shortly.'});document.querySelectorAll('.finance-dropdown-toggle').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('.finance-dropdown');const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open)}));</script><script src="test-drive-modal.js"></script></body></html>
