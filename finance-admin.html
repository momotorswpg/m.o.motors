<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Applications | M.O Motors</title><link rel="stylesheet" href="styles.css"></head><body><main class="form-page"><section class="form-hero"><p class="eyebrow red">M.O MOTORS ADMIN</p><h1 class="page-title">Financing applications</h1><p id="msg">Sign in with the authorized M.O Motors admin account to view applications.</p></section><section class="lead-form"><div id="login"><label>Email<input id="email" type="email" placeholder="Admin email"></label><label>Password<input id="password" type="password"></label><button class="btn btn-primary" id="signin">Sign in</button><p id="loginMsg" class="muted-copy"></p></div><div id="app" style="display:none"><button class="btn" id="refresh">Refresh applications</button> <button class="btn" id="signout">Sign out</button><div id="list" style="margin-top:24px"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const url='https://dpsgtliddmdvfwjahkkq.supabase.co',key='sb_publishable_f-MRqpvq-FGsxQ7dBNIyKQ_r8MB1VM0',db=supabase.createClient(url,key),msg=document.getElementById('loginMsg');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {data,error}=await db.from('finance_applications').select('*').order('created_at',{ascending:false});const el=document.getElementById('list');if(error){el.textContent='Unable to load applications.';return}el.innerHTML=data.length?data.map(x=>`<article style="border:1px solid #ddd;padding:20px;margin:14px 0"><h2>${esc(x.first_name)} ${esc(x.last_name)}</h2><p><strong>Status:</strong> ${esc(x.status)} · ${new Date(x.created_at).toLocaleString()}</p><p><strong>Email:</strong> ${esc(x.email)}<br><strong>Phone:</strong> ${esc(x.phone)}<br><strong>Vehicle:</strong> ${esc(x.vehicle_interest)}</p><details><summary>View full application</summary><div style="margin-top:14px">${Object.entries(x).filter(([k])=>!['id','first_name','last_name','email','phone','vehicle_interest','created_at'].includes(k)).map(([k,v])=>`<p><strong>${esc(k.replaceAll('_',' '))}:</strong> ${esc(v)}</p>`).join('')}</div></details></article>`).join(''):'No applications yet.'}async function state(){const {data:{session}}=await db.auth.getSession();document.getElementById('login').style.display=session?'none':'block';document.getElementById('app').style.display=session?'block':'none';if(session)load()}document.getElementById('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});msg.textContent=error?'Sign-in failed.': '';await state()};document.getElementById('refresh').onclick=load;document.getElementById('signout').onclick=async()=>{await db.auth.signOut();state()};state();</script></body></html>
