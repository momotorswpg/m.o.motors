O APPLICATION — NOT A REAL CUSTOMER. This record exists only in the browser to test the admin interface and is not stored in the database.',status:'Demo',created_at:new Date().toISOString()};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(data,isDemo=false){const el=document.getElementById('list');el.innerHTML=data.length?`${isDemo?'<p class="muted-copy"><strong>Demo mode:</strong> This fictional application is not stored in Supabase.</p>':''}`+data.map(x=>`<article style="border:1px solid #ddd;padding:20px;margin:14px 0"><h2>${esc(x.first_name)} ${esc(x.last_name)}${isDemo?' <small style="font-size:.6em">DEMO</small>':''}</h2><p><strong>Status:</strong> ${esc(x.status)} · ${new Date(x.created_at).toLocaleString()}</p><p><strong>Email:</strong> ${esc(x.email)}<br><strong>Phone:</strong> ${esc(x.phone)}<br><strong>Vehicle:</strong> ${esc(x.vehicle_interest)}</p><details><summary>View full application</summary><div style="margin-top:14px">${Object.entries(x).filter(([k])=>!['id','first_name','last_name','email','phone','vehicle_interest','created_at'].includes(k)).map(([k,v])=>`<p><strong>${esc(k.replaceAll('_',' '))}:</strong> ${esc(v)}</p>`).join('')}</div></details></article>`).join(''):'No applications yet.'}async function load(){demoMode=false;const {data,error}=await db.from('finance_applications').select('*').order('created_at',{ascending:false});if(error){const el=document.getElementById('list');el.innerHTML=`<p class="muted-copy"><strong>Access problem:</strong> ${esc(error.message)}${error.code?` (${esc(error.code)})`:''}</p><p class="muted-copy">Make sure you are signed in with the authorized M.O Motors admin account.</p>`;return}render(data)}async function state(){const {data:{session}}=await db.auth.getSession();document.getElementById('login').style.display=session?'none':'block';document.getElementById('app').style.display=session?'block':'none';if(session){document.getElementById('account').textContent=`Signed in as ${session.user.email}`;load()}}document.getElementById('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});msg.textContent=error?`Sign-in failed: ${error.message}`:'';await state()};document.getElementById('refresh').onclick=load;document.getElementById('demo').onclick=()=>{demoMode=true;render([demo],true)};document.getElementById('signout').onclick=async()=>{await db.auth.signOut();state()};state();</script></body></html>
